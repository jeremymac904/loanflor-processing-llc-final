# Whisper's routines (Hermes cron jobs in this profile). Created once by the installer; edit in the Cron page.
# Every routine is read/analysis + proposal only. External side effects still stop at Ashley's approval.
routines:
- name: Whisper inbox action sweep
  schedule: 45 7 * * 1-5
  skills:
  - flo-communication
  - flo-notes-and-emails
  prompt: 'Inbox action sweep: read recent email if reachable (Zapier Gmail find/search only), group what
    needs a reply by file, and create drafts with flo_draft. Drafting is not sending.'
- name: Whisper milestone update queue
  schedule: 0 11 * * 1-5
  skills:
  - flo-compliance-messaging
  prompt: 'Milestone update queue: for workspaces whose milestone changed today, prepare borrower-facing
    drafts using only the approved template wording, and LO/realtor updates in Ashley''s voice. Queue
    them; do not send.'
