# Flo capability policy for Chadwick. Loaded by plugins/flo-policy from <HERMES_HOME>/flo/policy.yaml.
# Only tightens; irreversible actions can never drop below confirm.
version: 1
mass_outbound_threshold: 10
capabilities:
  mass_outbound: confirm
  drive_share_external: confirm
  drive_delete_permanent: confirm
  policy_disable: confirm
  credential_exposure: confirm
  email_send: confirm
  outbound_message: confirm
  portal_submit: confirm
  calendar_write: confirm
